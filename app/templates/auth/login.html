{# Minimal layout — no app nav while signed out. #}
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in — Financial Hygiene</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
</head>
<body>
<main class="container" style="max-width:420px;margin-top:4rem">
    <hgroup>
        <h1>Sign in</h1>
        <p>Use the credentials you registered during setup. Passkey
        sign-in arrives in the next release.</p>
    </hgroup>

    {% if error %}
    <article style="border-left:4px solid #dc2626;padding:0.6rem 1rem;margin-bottom:1rem">
        {{ error }}
    </article>
    {% endif %}

    <form id="loginForm" method="post" action="/login">
        <input type="hidden" name="return_to" value="{{ return_to }}">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required autocomplete="username">

        <button type="button" id="passkeyBtn" style="margin-bottom:0.4rem;display:none;width:100%">
            🔑 Sign in with a passkey
        </button>

        <details>
            <summary style="cursor:pointer">Sign in with a password</summary>
            <label for="password" style="margin-top:0.4rem">Password</label>
            <input type="password" id="password" name="password" autocomplete="current-password">
            <button type="submit">Sign in</button>
        </details>
    </form>

<script>
function b64urlToBytes(s) {
    const pad = "=".repeat((4 - s.length % 4) % 4);
    const bin = atob((s + pad).replace(/-/g, "+").replace(/_/g, "/"));
    return Uint8Array.from(bin, c => c.charCodeAt(0));
}
function bytesToB64url(bytes) {
    let bin = "";
    new Uint8Array(bytes).forEach(b => bin += String.fromCharCode(b));
    return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}

if (window.PublicKeyCredential) {
    document.getElementById("passkeyBtn").style.display = "inline-block";
}

document.getElementById("passkeyBtn")?.addEventListener("click", async () => {
    const username = document.getElementById("username").value.trim();
    if (!username) { alert("Username required"); return; }

    const optsResp = await fetch("/auth/webauthn/login/options", {
        method: "POST",
        body: new URLSearchParams({ username }),
    });
    if (!optsResp.ok) {
        alert("Could not start passkey sign-in"); return;
    }
    const opts = await optsResp.json();
    opts.challenge = b64urlToBytes(opts.challenge);
    if (opts.allowCredentials) {
        opts.allowCredentials.forEach(c => { c.id = b64urlToBytes(c.id); });
    }

    let cred;
    try {
        cred = await navigator.credentials.get({ publicKey: opts });
    } catch (e) {
        alert("Passkey sign-in cancelled: " + e.message); return;
    }

    const verifyResp = await fetch("/auth/webauthn/login/verify", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            username,
            return_to: {{ return_to | tojson }},
            id:    cred.id,
            rawId: bytesToB64url(cred.rawId),
            type:  cred.type,
            response: {
                clientDataJSON:    bytesToB64url(cred.response.clientDataJSON),
                authenticatorData: bytesToB64url(cred.response.authenticatorData),
                signature:         bytesToB64url(cred.response.signature),
                userHandle:        cred.response.userHandle ? bytesToB64url(cred.response.userHandle) : null,
            },
        }),
    });
    if (!verifyResp.ok) {
        alert("Sign-in failed"); return;
    }
    const data = await verifyResp.json();
    window.location.href = data.redirect || "/";
});
</script>
</main>
</body>
</html>
