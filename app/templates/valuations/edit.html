{% extends "base.html" %}
{% block title %}Edit Valuation &mdash; {{ account.name }}{% endblock %}

{% block content %}
<hgroup>
    <h1>Edit Valuation</h1>
    <p>{{ account.name }} &mdash; {{ account.display_type }}</p>
</hgroup>

<form method="post" action="/valuations/{{ account.id }}/edit/{{ valuation.id }}">
    <div class="grid">
        <div>
            <label for="value">Value *</label>
            <input type="number" id="value" name="value" step="0.01" required
                   value="{{ valuation.value }}">
        </div>
        <div>
            <label for="date">Date *</label>
            <input type="date" id="date" name="date" required
                   value="{{ valuation.date.strftime('%Y-%m-%d') }}">
        </div>
        <div>
            <label for="currency">Currency</label>
            <input type="text" id="currency" name="currency"
                   value="{{ valuation.currency }}">
        </div>
        <div>
            <label for="source">Source</label>
            <select id="source" name="source">
                {% for s in ["manual", "appraisal", "rentcast", "zillow", "kbb", "domain_au", "propertydata", "hm_land_registry", "market_data"] %}
                <option value="{{ s }}" {% if valuation.source == s %}selected{% endif %}>{{ s.replace("_", " ").title() }}</option>
                {% endfor %}
            </select>
        </div>
    </div>
    <label for="notes">Notes</label>
    <input type="text" id="notes" name="notes"
           value="{{ valuation.notes or '' }}" placeholder="Optional notes">

    <div class="btn-group">
        <button type="submit">Save Changes</button>
        <a href="/valuations/{{ account.id }}" role="button" class="outline">Cancel</a>
    </div>
</form>
{% endblock %}
